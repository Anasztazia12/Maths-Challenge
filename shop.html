<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4CAF50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Maths Challenge">
    <title>Avatar Shop</title>
    <link rel="preload" as="image" href="assets/image/background_operations.webp">
    <link rel="icon" type="image/png" href="assets/image/icon.png">
    <link rel="apple-touch-icon" href="assets/image/icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-operations">

    <div class="game-container shop-container shop2">
        <div class="hamburger-menu-wrapper">
            <button class="hamburger-btn" id="hamburger-btn" aria-label="Menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="hamburger-panel hidden" id="hamburger-panel">
                <button class="menu-item" id="menu-install-btn" hidden>Add to Home Screen</button>
                <button class="menu-item" id="menu-edit-profile-btn">Edit Profile Name</button>
                <button class="menu-item" id="menu-results-btn">Results</button>
                <button class="menu-item" id="menu-logout-btn">Logout</button>
                <button class="menu-item danger" id="menu-delete-account-btn">Delete Account</button>
            </nav>
        </div>

        <header class="shop2-header">
            <h1>Avatar Shop</h1>
            <div class="shop2-balance" aria-label="Your gold">
                <span class="shop2-coin" aria-hidden="true"></span>
                <b id="shop-points">0</b>
                <small>gold</small>
            </div>
        </header>

        <div class="shop2-layout">
            <section class="shop2-fitting" aria-label="Preview">
                <div id="shop-avatar-preview" class="shop2-stage-frame"></div>
                <div class="shop2-action" id="shop-action">
                    <div class="shop2-action-text">
                        <strong id="shop-action-title">Your avatar</strong>
                        <span id="shop-action-sub">Tap any item to try it on.</span>
                    </div>
                    <div class="shop2-action-buttons">
                        <button type="button" id="shop-cancel-btn" class="shop2-btn ghost hidden">Cancel</button>
                        <button type="button" id="shop-confirm-btn" class="shop2-btn primary hidden">Wear</button>
                    </div>
                </div>
            </section>

            <section class="shop2-catalog" aria-label="Items">
                <div id="shop-category-tabs" class="shop2-tabs" role="tablist"></div>
                <div id="shop-items" class="shop2-grid"></div>
                <p id="shop-status" class="shop2-status" aria-live="polite"></p>
            </section>
        </div>

        <button class="menu-btn" onclick="goBackToHome()">⬅ Back to Home</button>
    </div>

    <script src="assets/js/profile-manager.js"></script>
    <script src="assets/js/avatar-render.js"></script>
    <script src="assets/js/hamburger.js"></script>
    <script src="assets/js/session-guard.js"></script>
    <script src="assets/js/player-avatar-widget.js"></script>
    <script src="assets/js/shop.js"></script>
    <script src="assets/js/sw-register.js"></script>
    <script src="assets/js/pwa-install.js"></script>
</body>
</html>
